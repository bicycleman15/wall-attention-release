[project]
name = "wall-attn"
version = "0.1.0"
description = "Wall Attention: per-channel multiplicative-decay attention kernels (training + decode) in Triton."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "einops>=0.7",
    "flash-linear-attention>=0.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wall_attn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
